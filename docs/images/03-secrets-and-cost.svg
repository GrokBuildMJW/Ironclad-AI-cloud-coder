<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="t3 d3">
  <title id="t3">Only the coding profile is metered; Spark stays local and keyless</title>
  <desc id="d3">Cloud coder keys live in env. Spark has no vendor meter. External coding profiles need USD rates.</desc>
  <rect width="1100" height="560" fill="#0b0f14"/>
  <text x="40" y="44" fill="#e8eef4" font-family="Segoe UI, system-ui, sans-serif" font-size="24" font-weight="700">Keys and the meter</text>
  <text x="40" y="70" fill="#8b9aab" font-family="Segoe UI, system-ui, sans-serif" font-size="14">Only coding-lane calls can spend vendor money. Spark chat does not.</text>

  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="40" y="100" rx="16" width="500" height="250" fill="#1a2330" stroke="#3ee0c5" stroke-width="2"/>
    <text x="64" y="136" fill="#3ee0c5" font-size="12" letter-spacing="1.2">SPARK · ORCHESTRATOR</text>
    <text x="64" y="176" fill="#e8eef4" font-size="20" font-weight="700">Local, often keyless</text>
    <text x="64" y="210" fill="#b7c4d2" font-size="15">api_key: null is allowed</text>
    <text x="64" y="236" fill="#8b9aab" font-size="14">egress: local</text>
    <text x="64" y="258" fill="#8b9aab" font-size="14">USD rates may be omitted</text>
    <text x="64" y="280" fill="#8b9aab" font-size="14">(zero-cost local)</text>
    <text x="64" y="316" fill="#8b9aab" font-size="14">Do not mark Spark as external.</text>

    <rect x="560" y="100" rx="16" width="500" height="250" fill="#1a2330" stroke="#9b8cff" stroke-width="2"/>
    <text x="584" y="136" fill="#9b8cff" font-size="12" letter-spacing="1.2">CLOUD CODER · CODING LANE</text>
    <text x="584" y="176" fill="#e8eef4" font-size="20" font-weight="700">Env key + USD rates</text>
    <text x="584" y="214" fill="#e8eef4" font-size="14" font-family="ui-monospace, Consolas, monospace">${env:CLOUD_CODER_KEY}</text>
    <text x="584" y="246" fill="#8b9aab" font-size="14">Never commit the token</text>
    <text x="584" y="268" fill="#8b9aab" font-size="14">egress: external must be priced</text>
    <text x="584" y="290" fill="#8b9aab" font-size="14">Budgets stop a runaway code turn</text>
    <text x="584" y="316" fill="#8b9aab" font-size="14">Unresolved env: no cloud call.</text>
  </g>

  <rect x="40" y="380" rx="12" width="1020" height="150" fill="#151c24" stroke="#2a3544"/>
  <text x="60" y="414" fill="#e8eef4" font-family="Segoe UI, system-ui, sans-serif" font-size="15">What leaves the LAN</text>
  <text x="60" y="440" fill="#8b9aab" font-family="Segoe UI, system-ui, sans-serif" font-size="14">Coding-lane prompts and tool schemas for that turn.</text>
  <text x="60" y="464" fill="#8b9aab" font-family="Segoe UI, system-ui, sans-serif" font-size="14">Orchestrator prompts stay on Spark. The vault disk does not get mounted remotely.</text>
  <text x="60" y="488" fill="#8b9aab" font-family="Segoe UI, system-ui, sans-serif" font-size="14">Treat code-turn excerpts as leaving the building.</text>
</svg>
