<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" role="img" aria-labelledby="t3 d3">
  <title id="t3">Secrets stay in the environment, external profiles need prices</title>
  <desc id="d3">API keys live in env vars. config.yaml only has ${env:NAME}. External egress requires USD rates so Ironclad can stop before a runaway bill.</desc>
  <rect width="1100" height="540" fill="#0b0f14"/>
  <text x="40" y="44" fill="#e8eef4" font-family="Segoe UI, system-ui, sans-serif" font-size="24" font-weight="700">Keys and the meter</text>
  <text x="40" y="70" fill="#8b9aab" font-family="Segoe UI, system-ui, sans-serif" font-size="14">Cloud coder is the path where a misconfig can spend money. Ironclad fail-closes on purpose.</text>

  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="40" y="100" rx="16" width="500" height="240" fill="#1a2330" stroke="#f0a04b" stroke-width="2"/>
    <text x="64" y="136" fill="#f0a04b" font-size="12" letter-spacing="1.2">NEVER IN GIT</text>
    <text x="64" y="176" fill="#e8eef4" font-size="20" font-weight="700">The API key</text>
    <text x="64" y="210" fill="#b7c4d2" font-size="15">config.yaml only has:</text>
    <text x="64" y="238" fill="#e8eef4" font-size="15" font-family="ui-monospace, Consolas, monospace">api_key: ${env:CLOUD_CODER_KEY}</text>
    <text x="64" y="272" fill="#8b9aab" font-size="14">Set the env in the process that</text>
    <text x="64" y="294" fill="#8b9aab" font-size="14">starts Ironclad. Not in the file.</text>
    <text x="64" y="316" fill="#8b9aab" font-size="14">Unresolved key: no request is sent.</text>

    <rect x="560" y="100" rx="16" width="500" height="240" fill="#1a2330" stroke="#9b8cff" stroke-width="2"/>
    <text x="584" y="136" fill="#9b8cff" font-size="12" letter-spacing="1.2">EXTERNAL MUST BE PRICED</text>
    <text x="584" y="176" fill="#e8eef4" font-size="20" font-weight="700">USD rates</text>
    <text x="584" y="210" fill="#b7c4d2" font-size="15">input_usd_per_1m_tokens</text>
    <text x="584" y="232" fill="#b7c4d2" font-size="15">output_usd_per_1m_tokens</text>
    <text x="584" y="264" fill="#8b9aab" font-size="14">Required when egress is external.</text>
    <text x="584" y="286" fill="#8b9aab" font-size="14">Local Spark/4090 may be zero-cost.</text>
    <text x="584" y="308" fill="#8b9aab" font-size="14">Budgets stop a runaway turn.</text>
  </g>

  <rect x="40" y="370" rx="12" width="1020" height="140" fill="#151c24" stroke="#2a3544"/>
  <text x="60" y="404" fill="#e8eef4" font-family="Segoe UI, system-ui, sans-serif" font-size="15">What leaves your LAN</text>
  <text x="60" y="430" fill="#8b9aab" font-family="Segoe UI, system-ui, sans-serif" font-size="14">Prompts, tool schemas, and file excerpts Ironclad puts in the request.</text>
  <text x="60" y="454" fill="#8b9aab" font-family="Segoe UI, system-ui, sans-serif" font-size="14">The vault disk does not. The cloud cannot list_dir unless Ironclad sends that tool</text>
  <text x="60" y="478" fill="#8b9aab" font-family="Segoe UI, system-ui, sans-serif" font-size="14">and then runs it locally. Treat prompts as leaving the building.</text>
</svg>
