<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="t d">
  <title id="t">Ironclad stays local, the coder runs in the cloud</title>
  <desc id="d">Your machine runs Ironclad. Prompts go to a cloud model. Answers come back. Vault and tools stay on your computer.</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3ee0c5"/>
    </marker>
  </defs>
  <rect width="1100" height="520" fill="#0b0f14"/>
  <text x="40" y="44" fill="#e8eef4" font-family="Segoe UI, system-ui, sans-serif" font-size="24" font-weight="700">Who does what</text>
  <text x="40" y="70" fill="#8b9aab" font-family="Segoe UI, system-ui, sans-serif" font-size="14">Ironclad is the conductor. The cloud model is the musician. Your files stay in the workspace.</text>

  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="40" y="100" rx="16" width="460" height="250" fill="#1a2330" stroke="#3ee0c5" stroke-width="2"/>
    <text x="64" y="136" fill="#3ee0c5" font-size="12" letter-spacing="1.2">ON YOUR MACHINE</text>
    <text x="64" y="176" fill="#e8eef4" font-size="22" font-weight="700">Ironclad</text>
    <text x="64" y="210" fill="#b7c4d2" font-size="15">Process, vault, tools, approvals</text>
    <text x="64" y="236" fill="#8b9aab" font-size="14">Docker or native server</text>
    <text x="64" y="258" fill="#8b9aab" font-size="14">Ink or browser on loopback</text>
    <text x="64" y="280" fill="#8b9aab" font-size="14">Reads and writes your workspace</text>
    <text x="64" y="316" fill="#8b9aab" font-size="14">Does not think by itself</text>

    <rect x="600" y="100" rx="16" width="460" height="250" fill="#1a2330" stroke="#9b8cff" stroke-width="2"/>
    <text x="624" y="136" fill="#9b8cff" font-size="12" letter-spacing="1.2">IN THE CLOUD</text>
    <text x="624" y="176" fill="#e8eef4" font-size="22" font-weight="700">Coder model</text>
    <text x="624" y="210" fill="#b7c4d2" font-size="15">OpenAI-compatible chat API</text>
    <text x="624" y="236" fill="#8b9aab" font-size="14">or a vendor CLI on PATH</text>
    <text x="624" y="258" fill="#8b9aab" font-size="14">(that CLI still calls the cloud)</text>
    <text x="624" y="280" fill="#8b9aab" font-size="14">You pay per token, not a GPU</text>
    <text x="624" y="316" fill="#8b9aab" font-size="14">Never sees your disk directly</text>
  </g>

  <line x1="500" y1="200" x2="600" y2="200" stroke="#3ee0c5" stroke-width="3" marker-end="url(#a)"/>
  <text x="550" y="188" text-anchor="middle" fill="#3ee0c5" font-size="12" font-family="Segoe UI, system-ui, sans-serif">prompts</text>
  <line x1="600" y1="250" x2="500" y2="250" stroke="#f0a04b" stroke-width="3" marker-end="url(#a)"/>
  <text x="550" y="274" text-anchor="middle" fill="#f0a04b" font-size="12" font-family="Segoe UI, system-ui, sans-serif">answers</text>

  <rect x="40" y="380" rx="12" width="1020" height="110" fill="#151c24" stroke="#2a3544"/>
  <text x="60" y="414" fill="#e8eef4" font-family="Segoe UI, system-ui, sans-serif" font-size="15">A turn always goes through Ironclad first.</text>
  <text x="60" y="440" fill="#8b9aab" font-family="Segoe UI, system-ui, sans-serif" font-size="14">The cloud never mounts your workspace. Ironclad sends a prompt (and tools),</text>
  <text x="60" y="464" fill="#8b9aab" font-family="Segoe UI, system-ui, sans-serif" font-size="14">gets text or a tool call back, then runs the tool itself on your machine.</text>
</svg>
