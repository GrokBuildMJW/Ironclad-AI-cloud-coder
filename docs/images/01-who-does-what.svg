<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" role="img" aria-labelledby="t d">
  <title id="t">Spark orchestrator local, cloud coder only on the coding lane</title>
  <desc id="d">Chat and process stay on local Spark. Only the coding lane calls a cloud model.</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3ee0c5"/>
    </marker>
  </defs>
  <rect width="1100" height="580" fill="#0b0f14"/>
  <text x="40" y="44" fill="#e8eef4" font-family="Segoe UI, system-ui, sans-serif" font-size="24" font-weight="700">Two lanes, two places</text>
  <text x="40" y="70" fill="#8b9aab" font-family="Segoe UI, system-ui, sans-serif" font-size="14">The orchestrator never leaves the LAN. Only code turns go to the cloud.</text>

  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="40" y="100" rx="16" width="320" height="260" fill="#1a2330" stroke="#3ee0c5" stroke-width="2"/>
    <text x="60" y="136" fill="#3ee0c5" font-size="12" letter-spacing="1.2">LOCAL · SPARK</text>
    <text x="60" y="176" fill="#e8eef4" font-size="20" font-weight="700">Orchestrator</text>
    <text x="60" y="210" fill="#b7c4d2" font-size="15">Chat and process</text>
    <text x="60" y="236" fill="#8b9aab" font-size="14">Tool-loop admission</text>
    <text x="60" y="258" fill="#8b9aab" font-size="14">egress: local</text>
    <text x="60" y="280" fill="#8b9aab" font-size="14">llm.orchestrator_profile</text>
    <text x="60" y="316" fill="#8b9aab" font-size="14">Always this box.</text>

    <rect x="390" y="100" rx="16" width="320" height="260" fill="#1a2330" stroke="#f0a04b" stroke-width="2"/>
    <text x="410" y="136" fill="#f0a04b" font-size="12" letter-spacing="1.2">LOCAL · YOUR PC</text>
    <text x="410" y="176" fill="#e8eef4" font-size="20" font-weight="700">Ironclad</text>
    <text x="410" y="210" fill="#b7c4d2" font-size="15">Vault, tools, approvals</text>
    <text x="410" y="236" fill="#8b9aab" font-size="14">Picks the lane</text>
    <text x="410" y="258" fill="#8b9aab" font-size="14">Runs tools on disk</text>
    <text x="410" y="280" fill="#8b9aab" font-size="14">Does not think itself</text>
    <text x="410" y="316" fill="#8b9aab" font-size="14">Coding lane ≠ chat.</text>

    <rect x="740" y="100" rx="16" width="320" height="260" fill="#1a2330" stroke="#9b8cff" stroke-width="2"/>
    <text x="760" y="136" fill="#9b8cff" font-size="12" letter-spacing="1.2">CLOUD · CODING LANE ONLY</text>
    <text x="760" y="176" fill="#e8eef4" font-size="20" font-weight="700">Coder</text>
    <text x="760" y="210" fill="#b7c4d2" font-size="15">Code checkpoint</text>
    <text x="760" y="236" fill="#8b9aab" font-size="14">HTTP profile or vendor CLI</text>
    <text x="760" y="258" fill="#8b9aab" font-size="14">egress: external</text>
    <text x="760" y="280" fill="#8b9aab" font-size="14">Not the orchestrator</text>
    <text x="760" y="316" fill="#8b9aab" font-size="14">Chat does not go here.</text>
  </g>

  <line x1="360" y1="180" x2="390" y2="180" stroke="#3ee0c5" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="710" y1="230" x2="740" y2="230" stroke="#9b8cff" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="375" y="168" fill="#3ee0c5" font-size="11" font-family="Segoe UI, system-ui, sans-serif">chat</text>
  <text x="715" y="218" fill="#9b8cff" font-size="11" font-family="Segoe UI, system-ui, sans-serif">code</text>

  <rect x="40" y="390" rx="12" width="1020" height="150" fill="#151c24" stroke="#2a3544"/>
  <text x="60" y="424" fill="#e8eef4" font-family="Segoe UI, system-ui, sans-serif" font-size="15">You still need Spark.</text>
  <text x="60" y="450" fill="#8b9aab" font-family="Segoe UI, system-ui, sans-serif" font-size="14">Cloud coder is extra hardware-as-a-service for the coding lane only.</text>
  <text x="60" y="474" fill="#8b9aab" font-family="Segoe UI, system-ui, sans-serif" font-size="14">It does not steer the process. It does not replace orchestrator_profile.</text>
  <text x="60" y="498" fill="#8b9aab" font-family="Segoe UI, system-ui, sans-serif" font-size="14">Without Spark, chat and process still have nowhere to think.</text>
</svg>
